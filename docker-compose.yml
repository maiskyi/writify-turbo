version: "3.9"

services:
  writify_database:
    image: postgres:17
    container_name: writify-database
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: writify
    ports:
      - "5432:5432"
    volumes:
      - ./.data/writify-database:/var/lib/postgresql/data

  strapi_database:
    image: postgres:17
    container_name: strapi-database
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: strapi
    ports:
      - "5433:5432"
    volumes:
      - ./.data/strapi-database:/var/lib/postgresql/data

  # Proxies *.writify.localhost → host apps (no /etc/hosts needed)
  proxy:
    image: caddy:2-alpine
    container_name: writify-proxy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
